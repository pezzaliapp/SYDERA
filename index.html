<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy.

      SYDERA needs no external runtime resource of any kind, so the policy is
      as tight as the application allows: everything must come from its own
      origin, and nothing may be executed or loaded from anywhere else.

      This also removes, from the application side, any script a hosting layer
      or CDN might inject into the served HTML — an analytics or RUM beacon,
      for instance — which would otherwise contradict SYDERA's promise of no
      analytics, no telemetry and no third-party scripts.

      Directive by directive, verified against what the application does:
        default-src 'self'   nothing is loaded from another origin
        script-src  'self'   one bundled module script; no inline script
        style-src   'self'   one bundled stylesheet; no inline style attribute
        img-src     'self' data:   icons, plus data URIs for generated marks
        font-src    'self'   system fonts only, no web font is fetched
        connect-src 'self'   the birth-place dataset, from the same origin
        worker-src  'self'   the service worker
        manifest-src 'self'  the web app manifest
        object-src  'none'   no plugins
        base-uri    'self'   the base URL cannot be rewritten
        form-action 'none'   no form is ever submitted anywhere

      frame-ancestors is deliberately absent: it is ignored in a meta policy
      and only works as an HTTP header, which static hosting cannot set.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SYDERA — Astrologia e numerologia simbolica</title>
    <meta
      name="description"
      content="SYDERA: analisi simbolica personale con astrologia occidentale e numerologia pitagorica. Calcoli trasparenti, dati locali, nessun account."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f16" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SYDERA" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>SYDERA richiede JavaScript: tutti i calcoli vengono eseguiti localmente nel browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
